# TLS in front of e-sign for the auth-manager integration job (CI only).
#
# auth-manager's transport refuses anything but an HTTPS endpoint, so the job gives e-sign a
# throwaway self-signed certificate that it trusts for this run alone. The body and the
# Authorization header pass through untouched: the actor assertion is bound to the body's exact
# bytes.

worker_processes 1;
pid /tmp/esign-integration/nginx.pid;
error_log /tmp/esign-integration/nginx-error.log;

events {}

http {
    access_log off;
    client_max_body_size 1m;

    server {
        listen 443 ssl;
        server_name esign.example.test;

        ssl_certificate /tmp/esign-integration/tls.crt;
        ssl_certificate_key /tmp/esign-integration/tls.key;

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
