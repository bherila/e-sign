# Publish the application image to GHCR. This repository publishes; it never deploys the image.
# Consumers pin a tag or digest and deploy it through their own pipeline.
#
#   push to main          -> ghcr.io/bherila/e-sign:main, :sha-<short>
#   release published     -> :<semver>, :<major>.<minor>, :latest (plus the sha tag)
#
# Each architecture builds natively on its own runner (no QEMU), pushes by digest, and a final
# job assembles the multi-arch manifest. The image is public (free storage and bandwidth on GHCR
# for public packages). No secrets can be in it by construction: .dockerignore excludes .env and
# key material.
name: Publish image

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
    outputs:
      digest-arm64: ${{ steps.export.outputs.digest-arm64 }}
      digest-amd64: ${{ steps.export.outputs.digest-amd64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Authenticated Composer API calls inside the build: the unauthenticated zipball path
      # returned intermittent 504s on earlier runs.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile
          target: production
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
          provenance: false
          secrets: |
            composer_auth={"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}

      - name: Export digest
        id: export
        run: echo "digest-${{ matrix.arch }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  manifest:
    name: Publish multi-arch manifest
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
          labels: |
            org.opencontainers.image.title=BWH eSign
            org.opencontainers.image.licenses=MIT AND LGPL-3.0-or-later
            org.opencontainers.image.description=Self-hosted PDF agreement preparation, e-signing, PAdES sealing, and evidence retention

      - name: Create and push manifest
        run: |
          set -eu
          tags=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | sed 's/^/--tag /' | tr '\n' ' ')
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags \
            "${IMAGE}@${{ needs.build.outputs.digest-arm64 }}" \
            "${IMAGE}@${{ needs.build.outputs.digest-amd64 }}"

      - name: Report
        run: |
          first=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -1)
          docker buildx imagetools inspect "$first" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin deployments to the manifest digest above, not to a tag." >> "$GITHUB_STEP_SUMMARY"

      # Free does not mean tidy: keep semver-tagged versions and the newest builds only.
      - name: Prune old untagged and sha- versions
        if: github.event_name != 'release'
        uses: actions/delete-package-versions@v5
        with:
          package-name: e-sign
          package-type: container
          min-versions-to-keep: 30
          ignore-versions: '^(latest|main|v?\d+\.\d+(\.\d+)?)$'
