# Publish the application image to GHCR. This repository publishes; it never deploys the image.
# Consumers pin a tag or digest and deploy it through their own pipeline.
#
#   push to main          -> ghcr.io/bherila/e-sign:main, :sha-<short>
#   release published     -> :<semver>, :<major>.<minor>, :latest (plus the sha tag)
#
# Each architecture builds natively on its own runner (no QEMU), pushes by digest, and a final
# job assembles the multi-arch manifest. The image is public (free storage and bandwidth on GHCR
# for public packages). No secrets can be in it by construction: .dockerignore excludes .env and
# key material.
name: Publish image

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
    outputs:
      digest-arm64: ${{ steps.export.outputs.digest-arm64 }}
      digest-amd64: ${{ steps.export.outputs.digest-amd64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Authenticated Composer API calls inside the build: the unauthenticated zipball path
      # returned intermittent 504s on earlier runs.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile
          target: production
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
          provenance: false
          # Applied to the image config at build time (takes precedence over the Dockerfile's
          # own static LABEL fallback, which only fires for a local `docker build`). Revision and
          # version are real here: the exact commit, and the release tag when this run is a
          # release, else the commit again.
          labels: |
            org.opencontainers.image.title=BWH eSign
            org.opencontainers.image.description=Self-hosted PDF agreement preparation, e-signing, PAdES sealing, and evidence retention
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT AND LGPL-3.0-or-later
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.event.release.tag_name || github.sha }}
          secrets: |
            composer_auth={"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}

      - name: Export digest
        id: export
        run: echo "digest-${{ matrix.arch }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  manifest:
    name: Publish multi-arch manifest
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels are set at build time in the `build` job (docker/build-push-action's `labels:`
      # input becomes part of each per-arch image's config); `imagetools create` below only
      # combines existing per-arch manifests by reference and cannot add labels to them, so this
      # step computes tags only.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Create and push manifest
        run: |
          set -eu
          tags=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | sed 's/^/--tag /' | tr '\n' ' ')
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags \
            "${IMAGE}@${{ needs.build.outputs.digest-arm64 }}" \
            "${IMAGE}@${{ needs.build.outputs.digest-amd64 }}"

      - name: Report
        run: |
          first=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -1)
          docker buildx imagetools inspect "$first" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin deployments to the manifest digest above, not to a tag." >> "$GITHUB_STEP_SUMMARY"

      # Free does not mean tidy: keep semver-tagged versions and the newest builds only.
      - name: Prune old untagged and sha- versions
        if: github.event_name != 'release'
        uses: actions/delete-package-versions@v5
        with:
          package-name: e-sign
          package-type: container
          min-versions-to-keep: 30
          ignore-versions: '^(latest|main|v?\d+\.\d+(\.\d+)?)$'

  sbom:
    # No embedded SBOM attestation: the per-arch native build + push-by-digest + `imagetools
    # create` manifest assembly above does not cleanly carry attestation manifests through the
    # merge (see DOCKER.md "SBOM"). Instead, this regenerates the same CycloneDX inventory the
    # CI `licenses` job produces, for the exact commit this run publishes, and attaches it where
    # a consumer of this image can find it: the GitHub Release on a release, and a workflow
    # artifact on every push. This *is* the image's SBOM.
    name: License inventory and SBOM
    needs: manifest
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install production dependencies
        timeout-minutes: 4
        run: |
          composer install --no-interaction --prefer-dist --no-dev --no-scripts &
          composer_pid=$!
          pnpm install --frozen-lockfile --prod --ignore-scripts &
          pnpm_pid=$!
          wait "$composer_pid"; composer_status=$?
          wait "$pnpm_pid"; pnpm_status=$?
          test "$composer_status" -eq 0 -a "$pnpm_status" -eq 0

      - name: Collect license inventories and build the SBOM
        run: |
          mkdir -p build/licenses
          composer licenses --format=json --no-interaction > build/licenses/composer-licenses.json
          pnpm licenses list --json --prod > build/licenses/pnpm-licenses.json
          php scripts/check-licenses.php \
            --composer=build/licenses/composer-licenses.json \
            --pnpm=build/licenses/pnpm-licenses.json \
            --sbom=build/licenses/sbom.cdx.json

      - name: Upload the SBOM as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-sbom
          path: build/licenses/sbom.cdx.json
          retention-days: 90
          if-no-files-found: error

      - name: Attach the SBOM to the GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" build/licenses/sbom.cdx.json \
            --repo "${{ github.repository }}" --clobber
