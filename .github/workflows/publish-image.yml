# Publish the application image to GHCR. This repository publishes; it never deploys the image.
# Consumers pin a tag or digest and deploy it through their own pipeline.
#
#   push to main          -> ghcr.io/bherila/e-sign:main, :sha-<short>
#   release published     -> :<semver>, :<major>.<minor>, :latest (plus the sha tag)
#
# The image is public (free storage and bandwidth on GHCR for public packages). No secrets can be
# in it by construction: .dockerignore excludes .env and key material.
name: Publish image

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
          labels: |
            org.opencontainers.image.title=BWH eSign
            org.opencontainers.image.licenses=MIT AND LGPL-3.0-or-later
            org.opencontainers.image.description=Self-hosted PDF agreement preparation, e-signing, PAdES sealing, and evidence retention

      # arm64 for the Lightsail/Graviton hosts and amd64 for laptops and CI elsewhere.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile
          target: production
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Report digest
        run: |
          echo "Pushed ${{ steps.meta.outputs.tags }}" | tr ',' '\n'
          echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin deployments to the digest above, not to a tag." >> "$GITHUB_STEP_SUMMARY"

      # Free does not mean tidy: keep semver-tagged versions and the newest SHA builds only.
      - name: Prune old untagged and sha- versions
        if: github.event_name != 'release'
        uses: actions/delete-package-versions@v5
        with:
          package-name: e-sign
          package-type: container
          min-versions-to-keep: 15
          ignore-versions: '^(latest|main|v?\d+\.\d+(\.\d+)?)$'
