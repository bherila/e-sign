name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Install Composer (with dev)
        run: composer install --no-interaction --prefer-dist

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Build frontend and run tests
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm run test

      # Mirror ci.yml: the suite expects an application .env to exist (the environment probe
      # checks for it), and paratest gives the same parallelism the PR checks use.
      - name: Prepare Laravel environment
        run: cp .env.example .env && php artisan key:generate --no-interaction --force

      - name: Run PHPUnit
        run: php artisan test --parallel

  deploy:
    runs-on: ubuntu-24.04-arm
    needs: test
    environment: prod
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Install Composer (no dev)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # Shared deploy for Laravel on a cPanel account: https://github.com/bherila/shared-cpanel-deployment
      # (its README lists every input and what each guard refuses). Pinned to a commit because this
      # job holds a key that reaches every application on the account.
      #
      # v2 builds and validates a versioned candidate (migrations included) before selecting it
      # beneath the real cPanel application directory, keeps the previous releases, and records the
      # exact selected commit. A migration or live-verification failure leaves the selected release in
      # maintenance for an explicit operator decision (failure-policy: maintenance).
      #
      # Only `storage` is shared across releases: it holds the uploaded documents (the local disk),
      # logs and framework caches. The seal key pair, delegated-access key and backups live under
      # ~/.config outside the application directory, and .env is copied forward from the selected
      # release. eSign has a scheduler and a bounded queue worker; quiesce.sh drains this app's
      # in-flight Artisan processes. The scheduler cron line is the action's default.
      - name: Deploy to cPanel
        id: cpanel
        uses: bherila/shared-cpanel-deployment@5f635730a4ddbac1d10c2a031ac0b4a102066fe2 # v2.5.0
        with:
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-username: ${{ secrets.SSH_USERNAME }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          deploy-dir: e-sign-laravel
          site-url: ${{ vars.SITE_URL }}
          deployment-mode: atomic
          atomic-layout: stable-directory
          persistent-paths: storage
          retain-releases: '3'
          failure-policy: maintenance
          # Needed for the first atomic conversion only (the exact commit the in-place deploy last
          # installed); the action ignores it once the application is already versioned.
          initial-live-commit: db4874aadb6ed9f698e1b1bb43556910f52f44eb
          # Normally empty. Set only to the exact owner reported by a failed atomic run; recovery
          # finalizes it and proves the selected application serves before retrying.
          recovery-release-id: ${{ vars.ATOMIC_RECOVERY_RELEASE_ID }}
          run-migrations: true
          operational-audit: 'true'
          artisan-memory-limit: 1G
          paths: |
            app
            bootstrap
            config
            database
            public
            resources
            routes
            storage
            vendor
            artisan
            composer.json
            composer.lock
            LICENSE
            THIRD_PARTY_NOTICES.md
          quiesce-script: scripts/deploy/quiesce.sh
          verification-script: scripts/deploy/verify-live.sh
          extra-cron-lines: |
            * * * * * cd "$HOME/e-sign-laravel" && /opt/cpanel/ea-php85/root/usr/bin/php -d memory_limit=1G artisan esign:queue:work-bounded > /dev/null 2>&1 # JOB:e-sign-laravel-queue-worker
