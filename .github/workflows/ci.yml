name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly, off the hour to avoid GitHub's top-of-hour scheduling crunch. Advisory databases
    # gain new entries after a merge, not just when a lock file changes, so the `audit` job needs
    # a trigger independent of the `changes` diff.
    - cron: '17 5 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04-arm
    outputs:
      # On a schedule run there is no PR/push diff to filter (dorny/paths-filter has no base to
      # compare against), so every output defaults to 'true' instead: a scheduled run is a "run
      # everything, including audit" full sweep rather than a partial one that could hide a
      # newly published advisory behind a filter meant for source-code changes.
      frontend: ${{ github.event_name == 'schedule' && 'true' || steps.filter.outputs.frontend }}
      backend: ${{ github.event_name == 'schedule' && 'true' || steps.filter.outputs.backend }}
      docker: ${{ github.event_name == 'schedule' && 'true' || steps.filter.outputs.docker }}
      licenses: ${{ github.event_name == 'schedule' && 'true' || steps.filter.outputs.licenses }}
      audit: ${{ github.event_name == 'schedule' && 'true' || steps.filter.outputs.licenses }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        if: github.event_name != 'schedule'
        id: filter
        with:
          token: ''
          filters: |
            frontend:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.css'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'vite.config.*'
              - 'jest.config.*'
              - 'resources/**'
              - 'tests-ts/**'
              - '.github/workflows/**'
            backend:
              - '**/*.php'
              - 'composer.json'
              - 'composer.lock'
              - '.env.example'
              - 'phpunit.xml'
              - 'app/**'
              - 'bootstrap/**'
              - 'config/**'
              - 'database/**'
              - 'routes/**'
              - 'tests/**'
              - 'scripts/**'
              # CI-only DSS profile checker; never part of the runtime, but the
              # `pades-profile` job below is built from it.
              - 'tools/**'
              # Drivers and proxy config for the `auth-manager-integration` job.
              - '.github/integration/**'
              - '.github/workflows/**'
            docker:
              - '.docker/**'
              - '.dockerignore'
              - 'docker-compose.yml'
            licenses:
              - 'composer.json'
              - 'composer.lock'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'scripts/check-licenses.php'
              - 'scripts/check-audit.php'
              - '.audit-allowlist.json'
              - 'THIRD_PARTY_NOTICES.md'
              - '.github/workflows/**'

  test:
    name: Changed-area checks (PHP ${{ matrix.php }})
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 8.4 is the supported floor; 8.5 is the Docker and cPanel deploy target.
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl, gd, exif, iconv
          coverage: none

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        timeout-minutes: 4
        run: |
          composer install --no-interaction --prefer-dist &
          composer_pid=$!
          pnpm install --frozen-lockfile &
          pnpm_pid=$!
          wait "$composer_pid"; composer_status=$?
          wait "$pnpm_pid"; pnpm_status=$?
          test "$composer_status" -eq 0 -a "$pnpm_status" -eq 0

      - name: Prepare Laravel environment
        run: cp .env.example .env && php artisan key:generate --no-interaction --force

      - name: Build frontend assets
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
        run: pnpm run build

      - name: Frontend checks
        if: needs.changes.outputs.frontend == 'true'
        timeout-minutes: 5
        run: |
          pnpm exec concurrently --kill-others-on-fail --names "tsc,lint,jest" \
            "pnpm run type-check" \
            "pnpm run lint" \
            "pnpm run test"

      - name: Backend checks
        if: needs.changes.outputs.backend == 'true'
        timeout-minutes: 8
        run: |
          ./vendor/bin/pint --parallel --test
          composer test

  database:
    name: Migrations and feature suite (${{ matrix.engine }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # `engine` names the job; `driver` is the Laravel connection. MariaDB 10.6 is what the
        # shared-hosting instance runs and it is stricter about NOT NULL TIMESTAMP defaults than
        # 11.4, so both MariaDB releases are exercised.
        include:
          - engine: mysql-8.4
            driver: mysql
            image: mysql:8.4
            health_cmd: mysqladmin ping --silent
          - engine: mariadb-11.4
            driver: mariadb
            image: mariadb:11.4
            health_cmd: healthcheck.sh --connect --innodb_initialized
          - engine: mariadb-10.6
            driver: mariadb
            image: mariadb:10.6
            health_cmd: healthcheck.sh --connect --innodb_initialized
    services:
      database:
        image: ${{ matrix.image }}
        env:
          # The mariadb image accepts the MYSQL_* names as legacy aliases for MARIADB_*, so one
          # set of env vars covers both engines. This is a throwaway container torn down with the
          # job; the root password has no value outside this run.
          MYSQL_DATABASE: esign_ci_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health_cmd }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: ${{ matrix.driver }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: esign_ci_test
      DB_USERNAME: root
      DB_PASSWORD: root
      ESIGN_TEST_DB_ENGINE: ${{ matrix.driver }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_mysql, bcmath, intl, gd, exif, iconv
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        timeout-minutes: 4
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: cp .env.example .env && php artisan key:generate --no-interaction --force

      - name: Run migrations against ${{ matrix.engine }}
        run: |
          # CI-only, and only here: this runs migrations against a disposable service container
          # created for this job and destroyed with it, never a persistent or shared database.
          # AGENTS.md's "never run migrate" rule protects real data on developer machines and
          # servers; it does not apply to this throwaway CI container. See
          # docs/adr/0002-supported-databases.md.
          php artisan migrate --force

      - name: Generate a CI-only phpunit configuration for ${{ matrix.engine }}
        run: |
          # phpunit.xml hardcodes DB_CONNECTION=sqlite and DB_DATABASE=:memory: so that a
          # developer running `composer test` can never point tests at a real database by
          # accident (see tests/SafeTestCase.php). Those two <env> values win over the shell
          # environment, so this job overrides them in a generated copy instead of weakening the
          # committed defaults.
          sed \
            -e 's#<env name="DB_CONNECTION" value="sqlite"/>#<env name="DB_CONNECTION" value="${{ matrix.driver }}"/>#' \
            -e 's#<env name="DB_DATABASE" value=":memory:"/>#<env name="DB_DATABASE" value="esign_ci_test"/>#' \
            phpunit.xml > phpunit.ci-db.xml

      - name: Feature suite on ${{ matrix.engine }}
        timeout-minutes: 10
        run: |
          # Laravel's ParallelTesting creates one esign_ci_test_test_{token} database per
          # paratest process (root can CREATE DATABASE), so --parallel is safe with a persistent
          # engine, not just SQLite in-memory. Tests\Support\TestDatabaseGuard is what lets
          # SafeTestCase accept this connection at all.
          #
          # --parallel must come before --configuration: Collision's artisan test command
          # doesn't declare --configuration in its own option definition and relies on Symfony
          # Console silently ignoring the unrecognized flag, but that ignoring aborts option
          # parsing at the point it's hit — anything after it on the command line is dropped.
          # Put --parallel first so it is bound before parsing reaches --configuration.
          php artisan test --parallel --configuration=phpunit.ci-db.xml

  licenses:
    name: License inventory and SBOM
    needs: changes
    if: needs.changes.outputs.licenses == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # The gate reads lock metadata only; the runtime matrix lives in the `test` job.
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      # Production trees only. Dev tooling is never distributed, so its licenses carry no
      # obligations and must not gate the build.
      - name: Install production dependencies
        timeout-minutes: 4
        run: |
          composer install --no-interaction --prefer-dist --no-dev --no-scripts &
          composer_pid=$!
          pnpm install --frozen-lockfile --prod --ignore-scripts &
          pnpm_pid=$!
          wait "$composer_pid"; composer_status=$?
          wait "$pnpm_pid"; pnpm_status=$?
          test "$composer_status" -eq 0 -a "$pnpm_status" -eq 0

      - name: Collect license inventories
        run: |
          mkdir -p build/licenses
          composer licenses --format=json --no-interaction > build/licenses/composer-licenses.json
          pnpm licenses list --json --prod > build/licenses/pnpm-licenses.json

      - name: Check licenses against the allowlist and build the SBOM
        run: |
          php scripts/check-licenses.php \
            --composer=build/licenses/composer-licenses.json \
            --pnpm=build/licenses/pnpm-licenses.json \
            --sbom=build/licenses/sbom.cdx.json

      - name: Upload the license inventory and SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: license-inventory
          path: build/licenses/
          retention-days: 30
          if-no-files-found: error

  audit:
    name: Dependency vulnerability audit
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip
          tools: composer
          coverage: none

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        timeout-minutes: 4
        run: |
          composer install --no-interaction --prefer-dist &
          composer_pid=$!
          pnpm install --frozen-lockfile &
          pnpm_pid=$!
          wait "$composer_pid"; composer_status=$?
          wait "$pnpm_pid"; pnpm_status=$?
          test "$composer_status" -eq 0 -a "$pnpm_status" -eq 0

      - name: Run composer audit
        # Never let composer's own exit code decide pass/fail: it fails on any advisory (which we
        # want to route through the allowlist) and, with the default --abandoned=fail, on any
        # abandoned package too (a maintenance signal, not a vulnerability, and out of scope
        # here). `check-audit.php` is the sole verdict; `--locked` reads composer.lock directly so
        # the report is not sensitive to what happens to be installed in vendor/.
        run: |
          mkdir -p build/audit
          set +e
          composer audit --format=json --locked --abandoned=report > build/audit/composer-audit.json
          set -e
          cat build/audit/composer-audit.json

      - name: Run pnpm audit
        # Same reasoning: pnpm's own exit code is ignored in favor of check-audit.php.
        # --ignore-registry-errors keeps a registry hiccup from failing the build with a result
        # that says nothing about our dependencies.
        run: |
          mkdir -p build/audit
          set +e
          pnpm audit --prod --audit-level=high --json --ignore-registry-errors > build/audit/pnpm-audit.json
          set -e
          cat build/audit/pnpm-audit.json

      - name: Check the audit reports against the allowlist
        run: |
          php scripts/check-audit.php \
            --composer=build/audit/composer-audit.json \
            --pnpm=build/audit/pnpm-audit.json \
            --allowlist=.audit-allowlist.json

      - name: Upload the raw audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit
          path: build/audit/
          retention-days: 14
          if-no-files-found: error

  image:
    name: Production image builds
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build production target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile
          target: production
          push: false
          load: true
          tags: bwh-esign:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the web role
        run: |
          docker run -d --name esign-smoke -p 8080:8080 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" -e APP_ENV=production -e APP_DEBUG=false \
            -e APP_URL=http://localhost:8080 -e DB_CONNECTION=sqlite -e DB_DATABASE=/tmp/esign.sqlite \
            -e SESSION_DRIVER=file -e CACHE_STORE=file -e QUEUE_CONNECTION=sync -e LOG_CHANNEL=stderr \
            bwh-esign:ci
          up=""
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/up >/dev/null; then up="1"; echo "up after ${i}s"; break; fi
            sleep 1
          done
          if [ -z "$up" ]; then
            docker logs esign-smoke
            exit 1
          fi
          # Prove the image's own HEALTHCHECK script reports the web role healthy, the same way
          # Docker's health state machine would (see .docker/scripts/healthcheck.sh).
          docker exec esign-smoke esign-healthcheck
          # The image's nginx must accept its own config, and its access-log map must keep
          # credential-bearing paths out of the log (issue #126) without hiding anything else.
          docker exec esign-smoke nginx -t
          envelope=01ARZ3NDEKTSV4RRFFQ69G5FAV
          sign_token=$(printf 'S%.0s' $(seq 1 43))
          invitation_token=$(printf 'a%.0s' $(seq 1 64))
          for path in "/sign/$envelope/$sign_token" "/invitations/$invitation_token" "/sign/$envelope/session"; do
            curl -s -o /dev/null "http://localhost:8080$path"
          done
          curl -s -o /dev/null -X POST "http://localhost:8080/sign/$envelope/$sign_token/start"
          sleep 1
          logs=$(docker logs esign-smoke 2>&1)
          if grep -q -e "$sign_token" -e "$invitation_token" <<<"$logs"; then
            echo "A credential-bearing path was written to the access log"
            exit 1
          fi
          grep -q "GET /sign/$envelope/session" <<<"$logs" || { echo "The signing session route is no longer logged"; exit 1; }
          docker rm -f esign-smoke >/dev/null

      - name: Smoke test role dispatch (artisan, worker)
        run: |
          set -eu
          # The one-shot `artisan` role is the cheap proof that the entrypoint's role dispatch
          # (.docker/scripts/entrypoint.sh) reaches `exec php artisan "$@"` correctly.
          docker run --rm \
            -e APP_KEY="base64:$(openssl rand -base64 32)" -e APP_ENV=production -e APP_DEBUG=false \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=/tmp/esign.sqlite -e SESSION_DRIVER=file \
            -e CACHE_STORE=file -e QUEUE_CONNECTION=sync -e LOG_CHANNEL=stderr \
            bwh-esign:ci artisan --version
          # The `worker` role, bounded with --stop-when-empty so it exits as soon as it finds no
          # queued jobs instead of running forever: proof that the worker role starts, that extra
          # arguments after the role name reach `queue:work`, and that the healthcheck script's
          # `pgrep -f queue:work` process check has something real to find while it runs.
          timeout 30 docker run --rm \
            -e APP_KEY="base64:$(openssl rand -base64 32)" -e APP_ENV=production -e APP_DEBUG=false \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=/tmp/esign.sqlite -e SESSION_DRIVER=file \
            -e CACHE_STORE=file -e QUEUE_CONNECTION=sync -e LOG_CHANNEL=stderr \
            bwh-esign:ci worker --stop-when-empty

  validation:
    name: Independent seal validation (pyHanko)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # The sealing path is pure PHP + OpenSSL; the supported floor is the
          # version the artifact has to be reproducible on.
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, bcmath, intl, gd, exif, iconv, openssl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: cp .env.example .env && php artisan key:generate --no-interaction --force

      - name: Install pyHanko
        run: |
          python3 -m venv /tmp/pyhanko-venv
          /tmp/pyhanko-venv/bin/pip install --quiet --upgrade pip
          # The CLI ships as its own distribution: installing pyhanko alone
          # gives the library and no `pyhanko` entry point.
          /tmp/pyhanko-venv/bin/pip install --quiet pyhanko pyhanko-cli

      # Reseals every artifact in tests/Fixtures/validation and checks each against the
      # outcome tests/Fixtures/validation/manifest.tsv requires. That includes the seal-key
      # rotation rows (issue #29): an artifact sealed under the retired key must be judged
      # VALID against the retired key's trust anchor and INVALID against the anchor of the
      # key that replaced it, and the artifact sealed under the new key must do the reverse.
      - name: Reseal the artifacts and validate them
        env:
          PYHANKO_VENV: /tmp/pyhanko-venv
        run: scripts/validate-seal.sh --regenerate

      - name: Upload the validator output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyhanko-validation
          path: |
            tests/Fixtures/validation/pyhanko-output.txt
            tests/Fixtures/validation/manifest.tsv
            tests/Fixtures/validation/*.pdf
          if-no-files-found: warn
          retention-days: 7

  pades-profile:
    name: PAdES profile conformance (DSS)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    # Deliberately a separate job from `validation` rather than another step inside it. The two
    # validators answer different questions — pyHanko: is the seal sound and trusted; DSS: which
    # ETSI baseline profile does it actually satisfy — and a JVM or Maven Central problem here
    # must not be able to take the pyHanko evidence down with it, or the reverse.
    steps:
      - uses: actions/checkout@v7

      # No PHP, no Composer, no resealing: this job reads the committed artifact bytes exactly
      # as they are. Regeneration belongs to the `validation` job, which owns the sealer's
      # freshness. Java is the only runtime here and it never leaves CI (see .dockerignore).
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Caches ~/.m2/repository, keyed on the pinned pom. The DSS jars are ~40 artifacts
          # and are otherwise re-downloaded from Maven Central on every run.
          cache: maven
          cache-dependency-path: tools/dss/pom.xml

      - name: Check the PAdES profile of every committed artifact
        env:
          MAVEN_ARGS: --batch-mode --no-transfer-progress
        run: scripts/validate-pades-profile.sh

      - name: Upload the DSS reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dss-pades-profile
          path: |
            tests/Fixtures/validation/dss-output.txt
            tests/Fixtures/validation/dss-report.json
            tests/Fixtures/validation/pades-profile-manifest.tsv
            tools/dss/reports
          if-no-files-found: warn
          retention-days: 7

  auth-manager-integration:
    # Delegated access depends on auth-manager (docs/operations/delegated-access.md). This runs
    # auth-manager's real transport, from its main branch, against this commit's e-sign over
    # HTTPS, each on its own database in one disposable MySQL container.
    name: Delegated access against auth-manager
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    services:
      database:
        image: mysql:8.4
        env:
          # A throwaway container torn down with the job; the password has no value outside it.
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      WORK: /tmp/esign-integration
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync

    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: bherila/auth-manager
          ref: main
          path: auth-manager
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_mysql, bcmath, intl, gd, exif, iconv, sodium
          ini-values: curl.cainfo=/etc/ssl/certs/ca-certificates.crt, openssl.cafile=/etc/ssl/certs/ca-certificates.crt
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        timeout-minutes: 6
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          composer install --no-interaction --prefer-dist --no-progress --working-dir=auth-manager

      - name: Create databases, TLS certificate and integration keys
        run: |
          mkdir -p "$WORK"
          php -r "new PDO('mysql:host=127.0.0.1;port=3306', 'root', 'root')->exec('CREATE DATABASE esign_integration; CREATE DATABASE auth_manager_integration');"

          # A self-signed certificate trusted for this run only, so the transport's HTTPS
          # requirement is met without weakening it.
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=esign.example.test \
            -addext subjectAltName=DNS:esign.example.test -addext basicConstraints=critical,CA:TRUE \
            -keyout "$WORK/tls.key" -out "$WORK/tls.crt"
          sudo cp "$WORK/tls.crt" /usr/local/share/ca-certificates/esign-integration.crt
          sudo update-ca-certificates
          echo '127.0.0.1 esign.example.test' | sudo tee -a /etc/hosts

          # The provider's integration key pair, generated for this run.
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$WORK/integration.key"
          chmod 600 "$WORK/integration.key"
          openssl pkey -in "$WORK/integration.key" -pubout -out "$WORK/integration.pub"

      - name: Prepare auth-manager
        working-directory: auth-manager
        env:
          DB_DATABASE: auth_manager_integration
        run: |
          # CI-only: migrations run against the job's disposable service container, never a
          # persistent or shared database (see the `database` job).
          cp .env.example .env
          php artisan key:generate --no-interaction --force
          php artisan migrate --force --no-interaction
          php ../.github/integration/auth-manager/drive.php seed "$WORK/ids.json"

      - name: Prepare and start e-sign
        env:
          DB_DATABASE: esign_integration
          OAUTH_PROVIDER: ci-auth-manager
          ESIGN_DELEGATED_ACCESS_ENABLED: 'true'
          ESIGN_DELEGATED_ACCESS_ISSUER: https://identity.example.test
          ESIGN_DELEGATED_ACCESS_ENDPOINT: https://esign.example.test/application-access
          ESIGN_DELEGATED_ACCESS_APPLICATION: e-sign
          ESIGN_DELEGATED_ACCESS_PUBLIC_KEYS: integration-v1|/tmp/esign-integration/integration.pub
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction --force
          php artisan migrate --force --no-interaction
          php .github/integration/auth-manager/seed-esign.php "$WORK/ids.json"

          # The built-in server inherits this step's environment (artisan serve would filter it).
          # Laravel's router script takes the working directory as the public path, so start it there.
          (cd public && nohup php -S 127.0.0.1:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php > "$WORK/server.log" 2>&1 &)
          command -v nginx >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends nginx; }
          sudo nginx -c "$GITHUB_WORKSPACE/.github/integration/auth-manager/nginx.conf"

          # An unsigned request must be refused over trusted TLS before the transport is tried.
          for _ in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://esign.example.test/application-access || true)
            [ "$status" = 401 ] && exit 0
            sleep 1
          done
          echo "e-sign did not answer an unsigned request with 401 (last status: $status)"
          exit 1

      - name: Drive delegated access through auth-manager's transport
        working-directory: auth-manager
        env:
          DB_DATABASE: auth_manager_integration
          AUTH_MANAGER_DELEGATED_ACCESS_ENABLED: 'true'
          AUTH_MANAGER_DELEGATED_ACCESS_WRITES_ENABLED: 'true'
          AUTH_MANAGER_DELEGATED_ACCESS_ISSUER: https://identity.example.test
          AUTH_MANAGER_DELEGATED_ACCESS_KEY_ID: integration-v1
          AUTH_MANAGER_DELEGATED_ACCESS_PRIVATE_KEY_PATH: /tmp/esign-integration/integration.key
        run: php ../.github/integration/auth-manager/drive.php run "$WORK/ids.json"

      - name: Show e-sign logs
        if: failure()
        run: |
          cat "$WORK/server.log" || true
          sudo cat "$WORK/nginx-access.log" "$WORK/nginx-error.log" || true
          tail -n 200 storage/logs/laravel.log || true
          tail -n 200 auth-manager/storage/logs/laravel.log || true

  result:
    name: CI result
    needs: [changes, test, database, auth-manager-integration, licenses, audit, image, validation, pades-profile]
    if: always()
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.changes.result }}" == "failure" || "${{ needs.changes.result }}" == "cancelled" ]]; then
            exit 1
          fi
          if [[ "${{ needs.test.result }}" == "failure" || "${{ needs.test.result }}" == "cancelled" ]]; then
            exit 1
          fi
          if [[ "${{ needs.database.result }}" == "failure" || "${{ needs.database.result }}" == "cancelled" ]]; then
            exit 1
          fi
          if [[ "${{ needs['auth-manager-integration'].result }}" == "failure" || "${{ needs['auth-manager-integration'].result }}" == "cancelled" ]]; then
            exit 1
          fi
          if [[ "${{ needs.licenses.result }}" == "failure" || "${{ needs.licenses.result }}" == "cancelled" ]]; then
            exit 1
          fi
          if [[ "${{ needs.audit.result }}" == "failure" || "${{ needs.audit.result }}" == "cancelled" ]]; then
            exit 1
          fi
          if [[ "${{ needs.image.result }}" == "failure" || "${{ needs.image.result }}" == "cancelled" ]]; then
            exit 1
          fi
          if [[ "${{ needs.validation.result }}" == "failure" || "${{ needs.validation.result }}" == "cancelled" ]]; then
            exit 1
          fi
          # Index syntax, not needs.pades-profile: the expression language reads the hyphen
          # as subtraction and the property access silently yields nothing.
          if [[ "${{ needs['pades-profile'].result }}" == "failure" || "${{ needs['pades-profile'].result }}" == "cancelled" ]]; then
            exit 1
          fi
          echo "Required checks passed or no code paths changed."
