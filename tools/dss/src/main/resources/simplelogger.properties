# DSS is chatty at INFO ("+ New CommonCertificateVerifier created." per artifact). The WARN
# lines are kept: they are the running commentary on why an artifact failed, and CI logs are
# where that belongs. Nothing here suppresses a validation result — those go to stdout and to
# the JSON report, never through the logger.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showDateTime=false
