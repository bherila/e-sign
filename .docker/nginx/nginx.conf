# nginx for the BWH eSign image. Runs as the unprivileged container user (www-data), so every
# writable path lives under /tmp and logs go to stdout/stderr. HTTP on 8080; php-fpm on a unix
# socket (see .docker/php/fpm-pool.conf).
worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Workspace invitation links (issue #110) and signing invitation links (issue #126) carry a live
    # credential in the path, so they are never written to the access log. The signing pattern is the
    # route's own token shape (SigningToken::ENCODED_LENGTH base64url characters) and covers both the
    # landing GET and its /start POST; session routes carry no token and stay logged. $request_uri is
    # the original request, so the rule still holds after the internal rewrite to index.php.
    map $request_uri $esign_loggable {
        "~^/invitations/[0-9a-f]{64}"               0;
        "~^/sign/[0-9A-Za-z]{26}/[A-Za-z0-9_-]{43}"  0;
        default                                     1;
    }
    access_log /dev/stdout combined if=$esign_loggable;

    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    server_tokens off;

    # Documents are uploaded and streamed through the app; keep this in step with php.ini.
    client_max_body_size 64M;

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # Signing pages must not leak recipient links to third parties.
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Delegated access requests are bounded by their contract (64 KiB). Refuse a larger body
        # here, declared or chunked, before PHP reads it: the application's global middleware
        # reads a JSON body before any controller can check its size.
        location = /application-access {
            client_max_body_size 64k;
            fastcgi_pass unix:/tmp/php-fpm.sock;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
            fastcgi_read_timeout 30;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass unix:/tmp/php-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_read_timeout 300;
        }

        location ~ /\. {
            deny all;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }
}
