; php-fpm overrides for the BWH eSign image. The container runs as www-data (non-root), so
; php-fpm cannot chown a socket or write to root-owned paths; everything lives under /tmp.
[global]
pid = /tmp/php-fpm.pid
error_log = /proc/self/fd/2
daemonize = yes

[www]
listen = /tmp/php-fpm.sock
listen.mode = 0660
catch_workers_output = yes
clear_env = no
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
