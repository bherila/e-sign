[PHP]
; Sealing and PDF assembly are CPU/memory bound; these bounds are per request/job. Keep them in
; step with client_max_body_size in .docker/nginx/nginx.conf and the app's preflight limits.
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 5
expose_php = Off
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
