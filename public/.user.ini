; PHP settings for the shared-hosting (cPanel) profile. PHP-FPM and LSAPI read .user.ini from
; the script's directory, so this file travels with public/ in every deploy and release bundle.
; Keep in step with .docker/php/php.ini and docs/operations/cpanel.md.
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 5
expose_php = Off
