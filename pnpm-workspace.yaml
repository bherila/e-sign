overrides:
  glob: ">=10.5.0"

# Dependencies whose install scripts may run. Everything else is blocked (pnpm default).
# esbuild ships prebuilt binaries for vite 8; unrs-resolver falls back to its JS build.
allowBuilds:
  spotlight-noindex: true
  esbuild: false
  unrs-resolver: false

# `pdfjs-dist` optionally depends on `@napi-rs/canvas` so that PDF.js can rasterise a page in
# Node. This application renders PDFs in the browser and nowhere else — the production runtime
# is PHP-only (AGENTS.md) and the image ships `public/build`, not `node_modules`. Installing it
# would add a platform-specific native binary, and its per-architecture siblings to the lock
# file, for a code path nothing here reaches.
ignoredOptionalDependencies:
  - "@napi-rs/canvas"
